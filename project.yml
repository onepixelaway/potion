name: Potion
options:
  bundleIdPrefix: com.tareqistyping
  deploymentTarget:
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
targets:
  Potion:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tareqistyping.potion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Potion
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: '1.1'
        CURRENT_PROJECT_VERSION: '2'
  PotionTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Potion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Potion:
    build:
      targets:
        Potion: all
        PotionTests: [test]
    test:
      targets: [PotionTests]
